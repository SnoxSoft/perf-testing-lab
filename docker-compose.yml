# The system under test, deliberately constrained.
#
# The CPU and memory limits below are the most important lines in this file. An
# unconstrained container inherits whatever the host happens to have spare, so
# the measured breaking point moves with background load and no two runs can be
# compared. Pinning them makes a result reproducible; changing them is a
# deliberate experiment, not an accident.

name: perflab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: perflab
      POSTGRES_USER: perflab
      POSTGRES_PASSWORD: perflab
      # Fixed shared_buffers so PostgreSQL does not size itself differently on
      # a different host. max_connections stays well above the application pool
      # ceiling, keeping the pool the bottleneck rather than the server.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c log_min_duration_statement=1000
    ports:
      - "5432:5432"
    cpus: 2.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perflab -d perflab"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      # Data lives in memory. The suite reseeds from scratch, and keeping disk
      # I/O out of the picture removes a variable nobody here is testing.
      - /var/lib/postgresql/data

  sut:
    build:
      context: .
      dockerfile: src/PerfLab.Sut/Dockerfile
    environment:
      ConnectionStrings__Sut: "Host=postgres;Port=5432;Database=perflab;Username=perflab;Password=perflab"
    ports:
      - "8080:8080"
    # Two cores and 1 GB. Small enough that the pathologies are reachable from a
    # laptop-hosted load generator without the generator saturating first.
    cpus: 2.0
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      # Long start period: the cold-start pathology delays the first request on
      # purpose, and the healthcheck must not race it.
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Optional observability stack. Off by default:
  #
  #   docker compose --profile observability up -d
  #
  # Deliberately opt-in. It adds two containers competing for the same host that
  # is running both the target and the generator, and the measured runs do not
  # need it — the four report formats and the committed baselines already carry
  # the results. Its value is watching a run unfold rather than reading it
  # afterwards, which matters for the long shapes: seeing the exact moment a
  # spike's backlog starts draining, or a soak's heap turning over.
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # k6 pushes rather than being scraped, and the receiver is off by default.
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    cpus: 1.0
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.6.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    cpus: 1.0
    mem_limit: 512m
    depends_on:
      - prometheus
